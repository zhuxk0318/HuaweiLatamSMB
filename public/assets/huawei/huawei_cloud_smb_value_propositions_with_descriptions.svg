<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Huawei Cloud for SMBs - 5 Core Value Propositions</title>
  <desc id="desc">A clean website hero banner showing five value propositions for SMBs with short explanatory taglines: AI-Ready Innovation, Reliable and Compliant, Cost-Effective Growth, Trusted by Industry Leaders, and Local Migration and Support.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eaf4ff"/>
    </linearGradient>
    <linearGradient id="blueGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.42" stop-color="#d8ecff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5b9dff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="redBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b7cff"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d90000"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8ecff" stop-opacity="0.25"/>
      <stop offset="0.45" stop-color="#7eb8ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#d8ecff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5b9dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0b2a64" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1d5fc4" flood-opacity="0.16"/>
    </filter>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .navy { fill:#061b5f; }
      .red { fill:#d90000; }
      .muted { fill:#4b5875; }
      .card-title { font-size:30px; line-height:1.1; font-weight:800; letter-spacing:-0.4px; }
      .card-desc { font-size:18px; line-height:1.4; font-weight:500; fill:#4b5875; }
      .num { font-size:54px; font-weight:800; fill:#d90000; }
      .thin-line { stroke:#d9e8ff; stroke-width:1.2; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1600" cy="860" r="360" fill="url(#glow)" opacity="0.8"/>
  <circle cx="320" cy="830" r="300" fill="url(#glow)" opacity="0.45"/>

  <!-- subtle bottom cloud-tech waves -->
  <path d="M0,790 C240,680 392,850 615,760 C850,665 1014,780 1190,712 C1410,626 1590,720 1920,600 L1920,1080 L0,1080 Z" fill="url(#wave)"/>
  <path d="M0,860 C260,720 475,885 720,800 C1010,700 1180,790 1390,710 C1590,636 1720,650 1920,560" fill="none" stroke="#cfe5ff" stroke-width="14" stroke-opacity="0.58"/>
  <path d="M0,905 C335,745 585,890 890,785 C1090,716 1300,790 1505,710 C1680,640 1810,705 1920,650" fill="none" stroke="#ffffff" stroke-width="10" stroke-opacity="0.75"/>
  <path d="M40,965 C320,810 600,980 865,880 C1115,785 1315,880 1540,775 C1715,700 1840,735 1920,705" fill="none" stroke="#90c3ff" stroke-width="3" stroke-opacity="0.55"/>
  <path d="M0,970 C350,830 675,950 940,850 C1230,740 1460,825 1920,720" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9"/>

  <!-- skyline -->
  <g opacity="0.22" fill="#76a9e9">
    <rect x="790" y="845" width="18" height="90" rx="2"/><rect x="817" y="800" width="28" height="135" rx="3"/>
    <rect x="860" y="825" width="21" height="110" rx="2"/><rect x="900" y="775" width="34" height="160" rx="4"/>
    <rect x="948" y="830" width="24" height="105" rx="2"/><rect x="988" y="795" width="42" height="140" rx="4"/>
    <rect x="1047" y="855" width="23" height="80" rx="2"/>
    <rect x="1720" y="725" width="34" height="210" rx="4"/><rect x="1768" y="795" width="48" height="140" rx="4"/>
    <rect x="1825" y="765" width="28" height="170" rx="3"/><rect x="1865" y="810" width="36" height="125" rx="4"/>
  </g>

  <!-- globe -->
  <g opacity="0.36" transform="translate(1320 725)">
    <circle cx="220" cy="220" r="210" fill="none" stroke="#5b9dff" stroke-width="2"/>
    <ellipse cx="220" cy="220" rx="210" ry="72" fill="none" stroke="#5b9dff" stroke-width="1.5"/>
    <ellipse cx="220" cy="220" rx="90" ry="210" fill="none" stroke="#5b9dff" stroke-width="1.5"/>
    <path d="M28 135 C130 180 300 95 414 160" fill="none" stroke="#5b9dff" stroke-width="1.5"/>
    <path d="M35 285 C165 240 290 330 410 260" fill="none" stroke="#5b9dff" stroke-width="1.5"/>
    <circle cx="115" cy="165" r="6" fill="#ffffff"/><circle cx="274" cy="114" r="6" fill="#ffffff"/><circle cx="336" cy="284" r="6" fill="#ffffff"/><circle cx="178" cy="310" r="6" fill="#ffffff"/>
  </g>
  <path d="M1185,920 C1360,850 1545,900 1775,780 C1820,755 1875,742 1920,735" fill="none" stroke="#d90000" stroke-width="5" stroke-linecap="round" opacity="0.72"/>
  <path d="M1185,920 C1360,850 1545,900 1775,780 C1820,755 1875,742 1920,735" fill="none" stroke="#ffb3b3" stroke-width="16" stroke-linecap="round" opacity="0.23"/>

  <!-- Header -->
  <g class="font" text-anchor="middle">
    <text x="960" y="155" font-size="72" font-weight="800" letter-spacing="-2" class="navy">Huawei Cloud for <tspan class="red">SMBs</tspan></text>
    <text x="960" y="220" font-size="36" font-weight="500" class="muted">5 Core Value Propositions</text>
    <rect x="939" y="247" width="42" height="5" rx="2.5" fill="#d90000"/>
  </g>

  <!-- Cards -->
  <g id="cards" class="font">
    <!-- CARD 1 -->
    <g transform="translate(73 360)" filter="url(#shadow)">
      <rect width="310" height="380" rx="22" fill="url(#card)" stroke="#d8e7fb"/>
      <circle cx="155" cy="0" r="47" fill="#fff" stroke="url(#redBlue)" stroke-width="3"/>
      <text x="155" y="18" text-anchor="middle" class="num">1</text>
      <g transform="translate(92 92)" filter="url(#softShadow)">
        <ellipse cx="64" cy="80" rx="82" ry="24" fill="#c8e1ff" opacity="0.52"/>
        <path d="M64 0 L128 34 L128 102 L64 136 L0 102 L0 34 Z" fill="url(#blueGlass)" stroke="#6ea7ff" stroke-width="2"/>
        <path d="M64 0 L64 136" stroke="#fff" stroke-opacity="0.8" stroke-width="2"/>
        <path d="M0 34 L64 68 L128 34" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
        <ellipse cx="64" cy="68" rx="98" ry="35" fill="none" stroke="#6ea7ff" stroke-width="3" opacity="0.65" transform="rotate(-12 64 68)"/>
        <circle cx="151" cy="51" r="5" fill="#d90000"/><circle cx="-24" cy="87" r="5" fill="#5b9dff"/>
        <text x="64" y="86" text-anchor="middle" font-size="45" font-weight="800" fill="#ffffff">AI</text>
      </g>
      <text x="155" y="280" text-anchor="middle" class="card-title navy"><tspan x="155">AI-Ready</tspan><tspan x="155" dy="36">Innovation</tspan></text>
      <text x="155" y="342" text-anchor="middle" class="card-desc"><tspan x="155">Accelerate AI adoption</tspan><tspan x="155" dy="24">with cloud-native intelligence</tspan></text>
    </g>

    <!-- CARD 2 -->
    <g transform="translate(421 360)" filter="url(#shadow)">
      <rect width="310" height="380" rx="22" fill="url(#card)" stroke="#d8e7fb"/>
      <circle cx="155" cy="0" r="47" fill="#fff" stroke="url(#redBlue)" stroke-width="3"/>
      <text x="155" y="18" text-anchor="middle" class="num">2</text>
      <g transform="translate(96 86)" filter="url(#softShadow)">
        <ellipse cx="62" cy="105" rx="86" ry="25" fill="#c8e1ff" opacity="0.52"/>
        <path d="M62 0 C95 17 115 18 132 18 C126 78 110 124 62 150 C14 124 -2 78 -8 18 C10 18 29 17 62 0Z" fill="url(#blueGlass)" stroke="#6ea7ff" stroke-width="3"/>
        <path d="M33 70 L56 94 L100 45" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="108" y="86" width="42" height="52" rx="8" fill="#4a8fff" opacity="0.92"/>
        <path d="M116 87 v-16 c0-16 26-16 26 0v16" fill="none" stroke="#0d3d9a" stroke-width="6"/>
        <circle cx="129" cy="112" r="5" fill="#ffffff"/>
      </g>
      <text x="155" y="280" text-anchor="middle" class="card-title navy"><tspan x="155">Reliable &amp;</tspan><tspan x="155" dy="36">Compliant</tspan></text>
      <text x="155" y="342" text-anchor="middle" class="card-desc"><tspan x="155">Secure and stable services</tspan><tspan x="155" dy="24">built for business trust</tspan></text>
    </g>

    <!-- CARD 3 -->
    <g transform="translate(769 360)" filter="url(#shadow)">
      <rect width="310" height="380" rx="22" fill="url(#card)" stroke="#d8e7fb"/>
      <circle cx="155" cy="0" r="47" fill="#fff" stroke="url(#redBlue)" stroke-width="3"/>
      <text x="155" y="18" text-anchor="middle" class="num">3</text>
      <g transform="translate(76 92)" filter="url(#softShadow)">
        <ellipse cx="80" cy="120" rx="104" ry="24" fill="#c8e1ff" opacity="0.52"/>
        <path d="M58 89 C36 89 20 75 20 55 C20 35 37 21 58 23 C67 8 85 0 106 0 C136 0 159 22 159 50 C178 54 192 68 192 86 C192 108 174 123 151 123 H58 C35 123 17 108 17 88 C17 87 17 86 17 86" fill="url(#blueGlass)" stroke="#6ea7ff" stroke-width="3"/>
        <rect x="62" y="78" width="22" height="45" rx="4" fill="#5b9dff" opacity="0.9"/>
        <rect x="94" y="55" width="22" height="68" rx="4" fill="#2f80ff" opacity="0.86"/>
        <rect x="126" y="35" width="22" height="88" rx="4" fill="#0f64de" opacity="0.82"/>
        <path d="M54 72 C82 60 110 46 145 12" fill="none" stroke="#d90000" stroke-width="6" stroke-linecap="round"/>
        <path d="M144 12 L142 45 L169 20 Z" fill="#d90000"/>
      </g>
      <text x="155" y="280" text-anchor="middle" class="card-title navy"><tspan x="155">Cost-Effective</tspan><tspan x="155" dy="36">Growth</tspan></text>
      <text x="155" y="342" text-anchor="middle" class="card-desc"><tspan x="155">Scale flexibly while optimizing</tspan><tspan x="155" dy="24">cost and performance</tspan></text>
    </g>

    <!-- CARD 4 -->
    <g transform="translate(1117 360)" filter="url(#shadow)">
      <rect width="310" height="380" rx="22" fill="url(#card)" stroke="#d8e7fb"/>
      <circle cx="155" cy="0" r="47" fill="#fff" stroke="url(#redBlue)" stroke-width="3"/>
      <text x="155" y="18" text-anchor="middle" class="num">4</text>
      <g transform="translate(88 82)" filter="url(#softShadow)">
        <ellipse cx="70" cy="130" rx="88" ry="22" fill="#c8e1ff" opacity="0.52"/>
        <path d="M22 20 H118 L140 62 L70 135 L0 62 Z" fill="url(#blueGlass)" stroke="#6ea7ff" stroke-width="3"/>
        <path d="M22 20 L70 135 L118 20" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.65"/>
        <path d="M0 62 H140" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
        <path d="M70 34 L82 59 L110 63 L90 82 L95 110 L70 96 L45 110 L50 82 L30 63 L58 59 Z" fill="#ffffff" opacity="0.9"/>
        <rect x="34" y="136" width="72" height="18" rx="9" fill="#65a6ff" opacity="0.72"/>
        <rect x="16" y="154" width="108" height="18" rx="9" fill="#a9d0ff" opacity="0.72"/>
      </g>
      <text x="155" y="280" text-anchor="middle" class="card-title navy"><tspan x="155">Trusted by</tspan><tspan x="155" dy="36">Industry Leaders</tspan></text>
      <text x="155" y="342" text-anchor="middle" class="card-desc"><tspan x="155">A proven choice across</tspan><tspan x="155" dy="24">major industries</tspan></text>
    </g>

    <!-- CARD 5 -->
    <g transform="translate(1465 360)" filter="url(#shadow)">
      <rect width="310" height="380" rx="22" fill="url(#card)" stroke="#d8e7fb"/>
      <circle cx="155" cy="0" r="47" fill="#fff" stroke="url(#redBlue)" stroke-width="3"/>
      <text x="155" y="18" text-anchor="middle" class="num">5</text>
      <g transform="translate(88 88)" filter="url(#softShadow)">
        <ellipse cx="72" cy="126" rx="94" ry="24" fill="#c8e1ff" opacity="0.52"/>
        <path d="M30 88 C10 88 -4 74 -4 55 C-4 37 11 23 30 24 C39 8 58 0 78 0 C106 0 128 21 128 49 C145 52 158 66 158 83 C158 103 142 118 121 118H30C10 118-5 105-5 88" fill="url(#blueGlass)" stroke="#6ea7ff" stroke-width="3"/>
        <path d="M36 82 C36 43 61 22 82 22 C104 22 130 42 130 82" fill="none" stroke="#1f78ff" stroke-width="10" stroke-linecap="round"/>
        <rect x="22" y="74" width="26" height="48" rx="12" fill="#1f78ff" opacity="0.92"/>
        <rect x="118" y="74" width="26" height="48" rx="12" fill="#1f78ff" opacity="0.92"/>
        <path d="M132 119 C124 140 106 147 83 142" fill="none" stroke="#d90000" stroke-width="6" stroke-linecap="round"/>
        <circle cx="82" cy="142" r="6" fill="#d90000"/>
      </g>
      <text x="155" y="280" text-anchor="middle" class="card-title navy"><tspan x="155">Local Migration</tspan><tspan x="155" dy="36">&amp; Support</tspan></text>
      <text x="155" y="342" text-anchor="middle" class="card-desc"><tspan x="155">Smooth migration with</tspan><tspan x="155" dy="24">responsive local service</tspan></text>
    </g>
  </g>

  <!-- lower decorative cubes -->
  <g opacity="0.55" transform="translate(1710 870)">
    <rect x="0" y="55" width="70" height="70" rx="8" fill="#cfe5ff" stroke="#ffffff"/>
    <rect x="82" y="20" width="90" height="90" rx="10" fill="#aed2ff" stroke="#ffffff"/>
    <rect x="190" y="0" width="110" height="110" rx="12" fill="#d8ecff" stroke="#ffffff"/>
  </g>
</svg>
