[project]
name = "langgraph-quote-agent"
version = "0.1.0"
description = "RVTools to Huawei Cloud quote export service"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<0.29",
  "json-repair>=0.44,<1.0",
  "langgraph>=1.1.10,<2.0",
  "openpyxl>=3.1,<4.0",
  "pandas>=2.2,<3.0",
  "pypdf>=5.0,<6.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "python-pptx>=1.0,<2.0",
  "uvicorn>=0.30,<1.0",
  "xlsxwriter>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
